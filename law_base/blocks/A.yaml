# law_base/blocks/A.yaml — Блок А: Документы на сайте
#
# Источник штрафов: КонсультантПлюс, КоАП РФ ст. 13.11
# Редакция: с учётом ФЗ-420 от 30.11.2024 (вступил в силу 30.05.2025)
# Источник норм: 152-ФЗ «О персональных данных»
# Дата верификации: 2026-05-17

violations:

  - id: "A1"
    version: "1.1.0"
    name: "Отсутствует политика обработки персональных данных"
    block: "A"
    enabled: true
    severity: "critical"
    is_recommendation: false
    legal_ref:
      law: "152-ФЗ"
      article: "ст. 18.1 ч.2"
      description: "Оператор обязан опубликовать документ, определяющий политику в отношении обработки персональных данных, и обеспечить неограниченный доступ к нему"
    fine:
      law: "КоАП РФ"
      article: "ч.3 ст.13.11"
      amounts:
        individual: "1 500 – 3 000 руб."
        official: "6 000 – 12 000 руб."
        entrepreneur: "10 000 – 20 000 руб."
        legal_entity: "30 000 – 60 000 руб."
    detector:
      method: "html_link_search"
      params:
        # Шаг 1: поиск ссылки в навигационных зонах (основной)
        primary_scope:
          - "footer"
          - "header"
          - "nav"
          - "[role='navigation']"
        # Шаг 2: если в primary_scope не найдено — поиск по всей странице
        fallback_scope: "body"
        # Ключевые слова для текста ссылки и href
        keywords:
          # "политик" покрывает: политика/политики/политику/политикой/политике
          # "конфиденциальност" покрывает: конфиденциальность/конфиденциальности
          - "политик"
          - "персональных данных"
          - "персональные данные"
          - "конфиденциальност"
          - "обработки данных"
          - "обработка данных"
          - "обработки персональных"
          - "обработка персональных"
          - "privacy policy"
          - "privacy"
          - "ПДн"
          - "data protection"
        # Шаг 3: проверить типовые URL если ссылка не найдена
        known_urls:
          - "/privacy"
          - "/policy"
          - "/privacy-policy"
          - "/politika"
          - "/politika-konfidencialnosti"
          - "/pd"
          - "/personal-data"
          - "/personalnyye-dannyye"
        # Шаг 4: проверить доступность найденной страницы
        # GET-запрос (не HEAD): проверяем статус + минимальное содержимое
        # HEAD недостаточен — сервер может вернуть 200 на кастомной 404
        verify_accessible: true
        min_status: 200
        max_status: 200
        # Убеждаемся что страница содержит текст политики, а не заглушку
        # Требуется совпадение минимум 2 из 4 ключевых слов
        # Одно слово ("обработка") встречается на любой странице — недостаточно
        content_min_match: 2
        content_keywords:
          - "персональных данных"
          - "обработка"
          - "оператор"
          - "согласие"
    fix:
      summary: "Разместить ссылку на Политику обработки ПДн в футере сайта"
      steps:
        - "Разработать документ «Политика обработки персональных данных» — он должен содержать: цели обработки, категории данных, правовые основания, права пользователя, контакты оператора"
        - "Опубликовать документ на отдельной странице сайта"
        - "Добавить ссылку на документ в футер — она должна присутствовать на каждой странице сайта"
        - "Убедиться что страница с политикой возвращает HTTP 200 и содержит актуальный текст документа"
