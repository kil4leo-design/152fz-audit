# law_base/blocks/C.yaml — Блок В: Cookie и аналитика
#
# Источник штрафов: КонсультантПлюс, КоАП РФ ст. 13.11
# Редакция: с учётом ФЗ-420 от 30.11.2024 (вступил в силу 30.05.2025)
# Источник норм: 152-ФЗ «О персональных данных»
#
# Примечание по ИП (ФЗ-420, примечание к ст.13.11 в целом):
# С 30.05.2025 ИП несут ответственность по ст.13.11 как юридические лица
# по всем частям, где ИП не указаны отдельно в тексте закона.
# Для ч.1 (C1) и ч.8 (C2) ИП в тексте закона не указаны → ИП = юрлицо.
#
# Дата верификации: 2026-05-17

violations:

  - id: "C1"
    name: "Сбор аналитики и cookie без согласия пользователя"
    block: "C"
    enabled: true
    severity: "critical"
    is_recommendation: false
    legal_ref:
      law: "152-ФЗ"
      article: "ст. 9"
      description: "Cookie-файлы и счётчики аналитики собирают персональные данные (IP-адрес, идентификаторы устройства, история посещений). Их использование без согласия пользователя является обработкой ПДн без законного основания"
    fine:
      law: "КоАП РФ"
      article: "ч.1 ст.13.11"
      amounts:
        individual: "10 000 – 15 000 руб."
        official: "50 000 – 100 000 руб."
        entrepreneur: "150 000 – 300 000 руб."
        legal_entity: "150 000 – 300 000 руб."
    detector:
      method: "html_cookie_banner_missing"
      params:
        analytics_signatures:
          - "ym("
          - "yandex_metrika"
          - "_ym_"
          - "gtag("
          - "google-analytics"
          - "top.mail.ru"
          - "vk.com/js/api"
        banner_selectors:
          - "#cookie-banner"
          - "#cookie-consent"
          - "#cookie-notice"
          - ".cookie-banner"
          - ".cookie-consent"
          - ".cookie-notice"
          - "[data-cookie]"
          - "[data-consent]"
        banner_keywords:
          - "cookie"
          - "куки"
          - "файлы cookie"
          - "используем файлы"
    fix:
      summary: "Установить cookie-баннер с запросом согласия при первом визите"
      steps:
        - "Установить cookie-баннер, который отображается при первом посещении сайта"
        - "Баннер должен содержать кнопку «Принять» и кнопку «Отклонить» или «Настроить»"
        - "Аналитические счётчики должны активироваться только после получения согласия"
        - "Выбор пользователя должен сохраняться и не запрашиваться повторно при следующих визитах"

  - id: "C2"
    name: "Использование зарубежных счётчиков аналитики — нарушение локализации ПДн"
    block: "C"
    enabled: true
    severity: "critical"
    is_recommendation: false
    legal_ref:
      law: "152-ФЗ"
      article: "ст. 18 ч.5"
      description: "Первичное размещение персональных данных граждан РФ должно осуществляться на территории РФ. Передача данных зарубежным сервисам аналитики нарушает требование локализации"
    fine:
      law: "КоАП РФ"
      article: "ч.8 ст.13.11"
      amounts:
        individual: "30 000 – 50 000 руб."
        official: "100 000 – 200 000 руб."
        entrepreneur: "1 000 000 – 6 000 000 руб."
        legal_entity: "1 000 000 – 6 000 000 руб."
    detector:
      method: "html_foreign_analytics"
      params:
        foreign_signatures:
          - "google-analytics.com"
          - "googletagmanager.com"
          - "gtag("
          - "google_analytics"
          - "connect.facebook.net"
          - "fbq("
          - "hotjar.com"
          - "clarity.ms"
    fix:
      summary: "Заменить зарубежные счётчики на российские аналоги"
      steps:
        - "Удалить с сайта Google Analytics, Facebook Pixel и другие зарубежные счётчики"
        - "Установить российские аналоги: Яндекс Метрика, VK Pixel, Roistat, Calltouch — их серверы находятся в РФ"
        - "Если зарубежный сервис необходим — подать уведомление в РКН о трансграничной передаче данных и получить разрешение"
        - "Обновить Политику обработки ПДн — указать актуальный список используемых счётчиков"
