# law_base/blocks/B.yaml — Блок Б: Механика согласия в формах
#
# Источник штрафов: КонсультантПлюс, КоАП РФ ст. 13.11
# Редакция: с учётом ФЗ-420 от 30.11.2024 (вступил в силу 30.05.2025)
# Источник норм: 152-ФЗ «О персональных данных»
#
# Примечание по ИП (ФЗ-420, примечание к ст.13.11 в целом):
# С 30.05.2025 ИП несут ответственность по ст.13.11 как юрлица
# по всем частям, где ИП не указаны отдельно в тексте закона.
# Для ч.2 ИП в тексте закона не указаны → ИП = юрлицо.
#
# Общий список PD-полей (pd_fields):
# Детектор проверяет name-атрибут И placeholder-атрибут — русские сайты
# часто используют латинские name, но русский placeholder.
# Дата верификации: 2026-05-17

# Общий список PD-полей используется в B1, B2, B3
# Вынесен в комментарий для единообразия — дублируется в каждом детекторе
# В будущем вынести в отдельный shared_params файл

violations:

  - id: "B1"
    version: "1.1.0"
    name: "Чекбокс согласия на обработку ПДн предустановлен"
    block: "B"
    enabled: true
    severity: "critical"
    is_recommendation: false
    legal_ref:
      law: "152-ФЗ"
      article: "ст. 9"
      description: "Согласие на обработку персональных данных должно быть получено в результате активного действия субъекта. Предустановленная галочка не является выражением воли субъекта"
    fine:
      law: "КоАП РФ"
      article: "ч.2 ст.13.11"
      amounts:
        individual: "10 000 – 15 000 руб."
        official: "100 000 – 300 000 руб."
        entrepreneur: "300 000 – 700 000 руб."
        legal_entity: "300 000 – 700 000 руб."
    detector:
      method: "html_checkbox_prechecked"
      params:
        # Условие: форма должна содержать ПД-поля
        # Если форма не собирает ПДн — чекбокс не является чекбоксом согласия
        pd_fields:
          - "email"
          - "phone"
          - "tel"
          - "name"
          - "fio"
          - "имя"
          - "фамилия"
          - "отчество"
          - "телефон"
          - "почта"
          - "адрес"
          - "address"
          - "birthdate"
          - "inn"
          - "инн"
          - "snils"
          - "снилс"
          - "паспорт"
          - "passport"
        pd_input_types:
          - "email"
          - "tel"
        # Ключевые слова для определения чекбокса согласия на ПДн
        # Усечённые формы покрывают падежи русского языка:
        # "соглас" → согласие/согласен/согласна/согласны/согласился и т.д.
        consent_keywords:
          - "соглас"
          - "персональных данных"
          - "персональные данные"
          - "обработку данных"
          - "обработки данных"
          - "personal data"
          - "consent"
        # Исключения: эти слова указывают что чекбокс НЕ о ПДн
        exclude_keywords:
          - "политика возврата"
          - "политика доставки"
          - "условия использования"
          - "пользовательское соглашение"
          - "подписка"
          - "рассылка"
        # Альтернативная форма согласия: текст рядом с кнопкой отправки
        # Это предупреждение (warning), не нарушение — юридически спорно
        alternative_consent:
          check_near_submit: true
          keywords:
            - "нажимая"
            - "соглашаетесь"
            - "продолжая"
            - "отправляя"
          severity_if_found: "warning"
    fix:
      summary: "Убрать предустановленную галочку с чекбокса согласия"
      steps:
        - "Найти все формы на сайте, собирающие персональные данные (имя, email, телефон и др.)"
        - "Убедиться что атрибут checked отсутствует у чекбокса согласия на обработку ПДн"
        - "Пользователь должен самостоятельно поставить галочку — это обязательное активное действие"

  - id: "B2"
    version: "1.1.0"
    name: "Форма сбора персональных данных без чекбокса согласия"
    block: "B"
    enabled: true
    severity: "critical"
    is_recommendation: false
    legal_ref:
      law: "152-ФЗ"
      article: "ст. 9"
      description: "Обработка персональных данных допускается только с согласия субъекта. Форма, собирающая ПДн без механизма получения согласия, нарушает этот принцип"
    fine:
      law: "КоАП РФ"
      article: "ч.2 ст.13.11"
      amounts:
        individual: "10 000 – 15 000 руб."
        official: "100 000 – 300 000 руб."
        entrepreneur: "300 000 – 700 000 руб."
        legal_entity: "300 000 – 700 000 руб."
    detector:
      method: "html_form_no_consent"
      params:
        # Проверяем name-атрибут И placeholder-атрибут input-элементов
        pd_fields:
          - "email"
          - "phone"
          - "tel"
          - "name"
          - "fio"
          - "имя"
          - "фамилия"
          - "отчество"
          - "телефон"
          - "почта"
          - "адрес"
          - "address"
          - "birthdate"
          - "inn"
          - "инн"
          - "snils"
          - "снилс"
          - "паспорт"
          - "passport"
        pd_input_types:
          - "email"
          - "tel"
        # Признаки наличия согласия на ПДн
        # "соглас" покрывает все падежи: согласие/согласен/согласна/согласны
        consent_keywords:
          - "соглас"
          - "персональных данных"
          - "персональные данные"
          - "обработку данных"
          - "обработки данных"
          - "personal data"
          - "consent"
        exclude_keywords:
          - "политика возврата"
          - "политика доставки"
          - "условия использования"
          - "пользовательское соглашение"
        # Альтернативная форма согласия через текст кнопки
        alternative_consent:
          check_near_submit: true
          keywords:
            - "нажимая"
            - "соглашаетесь"
            - "продолжая"
            - "отправляя"
          severity_if_found: "warning"
    fix:
      summary: "Добавить чекбокс согласия на обработку ПДн в каждую форму"
      steps:
        - "Найти все формы на сайте, собирающие персональные данные"
        - "Добавить чекбокс с текстом «Я согласен на обработку персональных данных»"
        - "Чекбокс должен быть обязательным (required) и не предустановленным"
        - "Рядом с чекбоксом разместить ссылку на Политику обработки ПДн"

  - id: "B3"
    version: "1.1.0"
    name: "В форме отсутствует ссылка на политику обработки ПДн"
    block: "B"
    enabled: true
    severity: "critical"
    is_recommendation: false
    legal_ref:
      law: "152-ФЗ"
      article: "ст. 9 ч.2"
      description: "Согласие в письменной форме должно включать наименование и адрес оператора, цель обработки, перечень данных, срок действия. Отсутствие ссылки на политику нарушает требования к составу согласия"
    fine:
      law: "КоАП РФ"
      article: "ч.2 ст.13.11"
      amounts:
        individual: "10 000 – 15 000 руб."
        official: "100 000 – 300 000 руб."
        entrepreneur: "300 000 – 700 000 руб."
        legal_entity: "300 000 – 700 000 руб."
    detector:
      method: "html_form_no_policy_link"
      params:
        pd_fields:
          - "email"
          - "phone"
          - "tel"
          - "name"
          - "fio"
          - "имя"
          - "фамилия"
          - "отчество"
          - "телефон"
          - "почта"
          - "адрес"
          - "address"
          - "birthdate"
          - "inn"
          - "инн"
          - "snils"
          - "снилс"
          - "паспорт"
          - "passport"
        pd_input_types:
          - "email"
          - "tel"
        policy_keywords:
          # "политик" покрывает: политика/политики/политику/политикой/политике
          # "конфиденциальност" покрывает: конфиденциальность/конфиденциальности/конфиденциальностью
          - "политик"
          - "персональных данных"
          - "конфиденциальност"
          - "privacy"
          - "обработки данных"
          - "обработка данных"
          - "ПДн"
        # Формализация "рядом с формой":
        # Уровень 1: внутри <form>
        # Уровень 2: в родительском контейнере (до max_depth уровней)
        # Уровень 3: текст кнопки отправки содержит ссылку на политику
        search_scope: "form_and_parent"
        max_depth: 2
        check_submit_text: true
        submit_keywords:
          - "политикой"
          - "условиями"
          - "соглашением"
          - "privacy"
    fix:
      summary: "Добавить ссылку на Политику обработки ПДн рядом с чекбоксом в форме"
      steps:
        - "Найти все формы на сайте, собирающие персональные данные"
        - "Добавить ссылку на Политику обработки ПДн рядом с чекбоксом согласия"
        - "Текст ссылки должен быть явным, например: «Политика обработки персональных данных»"
        - "Ссылка должна вести на актуальный документ, размещённый на сайте"
