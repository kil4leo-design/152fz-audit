  - id: "KOAP-13.11"
    name: "КоАП РФ Статья 13.11"
    law: "КоАП РФ от 30.12.2001 N 195-ФЗ"
    article: "Статья 13.11"
    last_amendment: "ФЗ-420 от 30.11.2024 (вступил в силу 30.05.2025)"
    url: "https://www.consultant.ru/document/cons_doc_LAW_34661/1f421640c6775ff67079ebde06a7d2f6d17b96db/"
    notes: |
      Санкции за нарушения в области ПДн.
      Примечание (ФЗ-420, с 30.05.2025): ИП несут ответственность как юрлица
      по всем частям статьи, где ИП не указаны отдельно в тексте закона.
      Исключение: ч.3, ч.4, ч.5 — ИП указаны отдельно, применяются явные суммы.

  - id: "FZ-420"
    name: "ФЗ-420 — поправки к КоАП в части ПДн"
    number: "420-ФЗ"
    date: "2024-11-30"
    effective_date: "2025-05-30"
    url: "https://www.consultant.ru/document/cons_doc_LAW_505887/"
    notes: "Многократно увеличил штрафы по ст.13.11. Ввёл примечание: ИП = юрлицо. Добавил новые составы: утечки (ч.12-18), биометрия (13.11.3)"

